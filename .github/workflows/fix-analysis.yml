name: Fix Flutter Analysis

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - name: Get dependencies
        run: flutter pub get

      - name: Fix files with Python
        run: |
          python3 << 'EOF'
          import re

          # 1. 修复 game_provider.dart
          with open('lib/providers/game_provider.dart', 'r') as f:
              content = f.read()
          
          # 删除未使用的 import
          content = content.replace("import '../data/npc_data.dart';\n", "")
          
          # 删除 _getPlayerGrade 方法
          content = re.sub(r'\n  int _getPlayerGrade\(\) \{[^}]+\}\n', '\n', content)
          
          # 在 CG 解锁注释前添加 formatDate 方法
          format_method = '''
  // ==================== 时间格式化 ====================
  String _formatDate() {
    final t = _worldState.time;
    final year = t.year;
    final month = _worldState.month ?? '九月';
    final day = _worldState.dayOfMonth;
    final weekday = _worldState.dayOfWeek ?? '周一';
    final hour = t.hour.toString().padLeft(2, '0');
    final minute = t.minute.toString().padLeft(2, '0');
    return '📅 ${year}年${month}${day}日，${weekday}，[${hour}:${minute}]';
  }

'''
          content = content.replace(
              '  // ==================== CG 解锁 ====================',
              format_method + '  // ==================== CG 解锁 ===================='
          )
          
          # 替换 formatDate 调用
          content = content.replace('_worldState.formatDate()', '_formatDate()')
          
          with open('lib/providers/game_provider.dart', 'w') as f:
              f.write(content)
          
          # 2. 修复 game_screen.dart
          with open('lib/screens/game_screen.dart', 'r') as f:
              content = f.read()
          content = content.replace('final rel = player.relationships', 'final _rel = player.relationships')
          with open('lib/screens/game_screen.dart', 'w') as f:
              f.write(content)
          
          # 3. 修复 intro_screen.dart
          with open('lib/screens/intro_screen.dart', 'r') as f:
              content = f.read()
          content = content.replace('String? petId;', 'String? _petId;')
          with open('lib/screens/intro_screen.dart', 'w') as f:
              f.write(content)
          
          print("✅ 修复完成！")
          EOF

      - name: Run analyze
        run: flutter analyze

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: resolve flutter analyze errors" || echo "No changes to commit"
          git push
