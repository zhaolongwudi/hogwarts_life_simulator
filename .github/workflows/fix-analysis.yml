name: Fix Flutter Analysis

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - name: Get dependencies
        run: flutter pub get

      - name: Fix wand_data.dart - remove unused import
        run: |
          sed -i "1d" lib/data/wand_data.dart

      - name: Fix game_provider.dart - remove unused import
        run: |
          sed -i "/import '..\/data\/npc_data.dart';/d" lib/providers/game_provider.dart

      - name: Fix game_provider.dart - remove unused method
        run: |
          sed -i '/int _getPlayerGrade() {/,/^  }$/d' lib/providers/game_provider.dart

      - name: Fix game_provider.dart - add formatDate method
        run: |
          cat >> lib/providers/game_provider.dart << 'EOF'

// ==================== 时间格式化 ====================
String _formatDate() {
  final t = _worldState.time;
  final year = t.year;
  final month = _worldState.month ?? '九月';
  final day = _worldState.dayOfMonth;
  final weekday = _worldState.dayOfWeek ?? '周一';
  final hour = t.hour.toString().padLeft(2, '0');
  final minute = t.minute.toString().padLeft(2, '0');
  return '📅 ${year}年${month}${day}日，${weekday}，[${hour}:${minute}]';
}
EOF
          sed -i 's/_worldState.formatDate()/_formatDate()/g' lib/providers/game_provider.dart

      - name: Fix game_screen.dart - unused variable
        run: |
          sed -i 's/final rel = player\.relationships/final _rel = player.relationships/g' lib/screens/game_screen.dart

      - name: Fix intro_screen.dart - unused variable
        run: |
          sed -i 's/String? petId;/String? _petId;/g' lib/screens/intro_screen.dart

      - name: Run analyze
        run: flutter analyze

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: resolve flutter analyze errors" || echo "No changes to commit"
          git push
