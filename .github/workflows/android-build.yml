name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bump version for build
        id: bump
        run: |
          PUB="pubspec.yaml"
          CURRENT=$(grep '^version:' "$PUB" | awk '{print $2}')
          BASE=$(echo "$CURRENT" | cut -d+ -f1)
          BUILD=$(echo "$CURRENT" | cut -d+ -f2)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          if [ "$PATCH" -ge 9 ]; then
            PATCH=0
            MINOR=$((MINOR + 1))
          else
            PATCH=$((PATCH + 1))
          fi
          if [ "$MINOR" -ge 10 ]; then
            MINOR=0
            MAJOR=$((MAJOR + 1))
          fi
          BUILD=$((BUILD + 1))
          NEW="${MAJOR}.${MINOR}.${PATCH}+${BUILD}"
          sed -i "s/^version: .*/version: $NEW/" "$PUB"
          echo "NEW_VERSION=${MAJOR}.${MINOR}.${PATCH}+${BUILD}" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "Version bumped: $CURRENT -> $NEW"

      - name: Sync changelog to README
        id: sync
        run: |
          chmod +x scripts/sync_changelog.sh
          bash scripts/sync_changelog.sh
          git add README.md pubspec.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "SYNCED=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: sync changelog for v${{ steps.bump.outputs.VERSION_NAME }} [skip ci]"
            git pull --rebase origin main || true
            git push origin main
            echo "✅ Changelog synced and pushed"
            echo "SYNCED=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Dependencies
        run: flutter pub upgrade && flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        id: build
        run: |
          flutter build apk --release 2>&1 | tee build_output.log || true
          # If flutter can't find APK, try building with Gradle directly
          APK_PATH=$(find . -name "app-release.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "Flutter build didn't produce APK, trying Gradle directly..."
            cd android && ./gradlew assembleRelease 2>&1 | tee -a ../build_output.log
            cd ..
            APK_PATH=$(find . -name "app-release.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -n "$APK_PATH" ]; then
            echo "BUILD_EXIT_CODE=0" > build_result.txt
            echo "APK_PATH=$APK_PATH" >> build_result.txt
          else
            echo "BUILD_EXIT_CODE=1" > build_result.txt
          fi
        timeout-minutes: 20

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ steps.bump.outputs.VERSION_NAME }}
          path: |
            build_output.log
            build_result.txt
          retention-days: 30

      - name: Check build result and locate APK
        id: apk
        run: |
          EXIT_CODE=$(grep BUILD_EXIT_CODE build_result.txt | cut -d= -f2)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Build failed with exit code: $EXIT_CODE"
            tail -100 build_output.log
            exit 1
          fi
          APK_PATH=$(grep APK_PATH build_result.txt | cut -d= -f2)
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          APK_PATH="${{ steps.apk.outputs.APK_PATH }}"
          APK_DIR=$(dirname "$APK_PATH")
          cp "$APK_PATH" "$APK_DIR/HogwartLige-${{ steps.bump.outputs.VERSION_NAME }}.apk"
          echo "RENAMED_APK=$APK_DIR/HogwartLige-${{ steps.bump.outputs.VERSION_NAME }}.apk" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HogwartLige-${{ steps.bump.outputs.VERSION_NAME }}
          path: ${{ env.RENAMED_APK }}
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="${{ steps.bump.outputs.VERSION_NAME }}"
          gh release create "v${VERSION_NAME}" \
            "${{ env.RENAMED_APK }}" \
            --title "HogwartLige v${VERSION_NAME}" \
            --generate-notes