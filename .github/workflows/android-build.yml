name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bump version for build
        id: bump
        run: |
          PUB="pubspec.yaml"
          CURRENT=$(grep '^version:' "$PUB" | awk '{print $2}')
          BASE=$(echo "$CURRENT" | cut -d+ -f1)
          BUILD=$(echo "$CURRENT" | cut -d+ -f2)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          if [ "$PATCH" -ge 9 ]; then
            PATCH=0
            MINOR=$((MINOR + 1))
          else
            PATCH=$((PATCH + 1))
          fi
          if [ "$MINOR" -ge 10 ]; then
            MINOR=0
            MAJOR=$((MAJOR + 1))
          fi
          BUILD=$((BUILD + 1))
          NEW="${MAJOR}.${MINOR}.${PATCH}+${BUILD}"
          sed -i "s/^version: .*/version: $NEW/" "$PUB"
          echo "NEW_VERSION=${MAJOR}.${MINOR}.${PATCH}+${BUILD}" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "Version bumped: $CURRENT -> $NEW"

      - name: Sync changelog to README
        id: sync
        run: |
          chmod +x scripts/sync_changelog.sh
          bash scripts/sync_changelog.sh
          git add README.md pubspec.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "SYNCED=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: sync changelog for v${{ steps.bump.outputs.VERSION_NAME }} [skip ci]"
            git pull --rebase origin main || true
            git push origin main
            echo "✅ Changelog synced and pushed"
            echo "SYNCED=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Gradle setup
        run: |
          echo "=== Gradle Wrapper Properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "=== Downloading Gradle distribution ==="
          DISTRIBUTION_URL=$(grep 'distributionUrl' android/gradle/wrapper/gradle-wrapper.properties | cut -d'=' -f2-)
          DISTRIBUTION_URL="https:${DISTRIBUTION_URL#https\\:}"
          echo "URL: $DISTRIBUTION_URL"
          curl -sI "$DISTRIBUTION_URL" | head -5
          echo "=== Gradle wrapper test ==="
          cd android && ./gradlew --version 2>&1 || echo "Gradle wrapper test failed"
          cd ..

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release
        timeout-minutes: 10

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/HogwartLige-${{ steps.bump.outputs.VERSION_NAME }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HogwartLige-${{ steps.bump.outputs.VERSION_NAME }}
          path: build/app/outputs/flutter-apk/HogwartLige-${{ steps.bump.outputs.VERSION_NAME }}.apk
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="${{ steps.bump.outputs.VERSION_NAME }}"
          gh release create "v${VERSION_NAME}" \
            build/app/outputs/flutter-apk/HogwartLige-${VERSION_NAME}.apk \
            --title "HogwartLige v${VERSION_NAME}" \
            --generate-notes
