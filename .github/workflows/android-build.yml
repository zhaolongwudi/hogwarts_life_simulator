name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bump version for build
        id: bump
        run: |
          PUB="pubspec.yaml"
          CURRENT=$(grep '^version:' "$PUB" | awk '{print $2}')
          BASE=$(echo "$CURRENT" | cut -d+ -f1)
          BUILD=$(echo "$CURRENT" | cut -d+ -f2)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          if [ "$PATCH" -ge 9 ]; then
            PATCH=0
            MINOR=$((MINOR + 1))
          else
            PATCH=$((PATCH + 1))
          fi
          if [ "$MINOR" -ge 10 ]; then
            MINOR=0
            MAJOR=$((MAJOR + 1))
          fi
          BUILD=$((BUILD + 1))
          NEW="${MAJOR}.${MINOR}.${PATCH}+${BUILD}"
          sed -i "s/^version: .*/version: $NEW/" "$PUB"
          echo "NEW_VERSION=${MAJOR}.${MINOR}.${PATCH}+${BUILD}" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "Version bumped: $CURRENT -> $NEW"

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/HogwartLige-${{ steps.bump.outputs.VERSION_NAME }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HogwartLige-${{ steps.bump.outputs.VERSION_NAME }}
          path: build/app/outputs/flutter-apk/HogwartLige-${{ steps.bump.outputs.VERSION_NAME }}.apk
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="${{ steps.bump.outputs.VERSION_NAME }}"
          gh release create "v${VERSION_NAME}" \
            build/app/outputs/flutter-apk/HogwartLige-${VERSION_NAME}.apk \
            --title "HogwartLige v${VERSION_NAME}" \
            --generate-notes