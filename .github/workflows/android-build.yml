name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  # upload-artifact 需要 actions: write；只写 contents 会把其余权限压成 none
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 锁定版本，不追 stable 漂移。
          # 原因：CI 曾出现「本地 0 error、CI 1 error」的幽灵失败——代码没变，
          # 只是 runner 上的 stable 悄悄升了级，analyzer 把某条诊断提级成 error。
          # 锁死版本后 CI 与本地完全可复现；要升级时由人显式改这里。
          channel: 'stable'
          flutter-version: '3.47.2'
          cache: true

      - name: Bump version for build
        id: bump
        run: |
          PUB="pubspec.yaml"
          CURRENT=$(grep '^version:' "$PUB" | awk '{print $2}')
          BASE=$(echo "$CURRENT" | cut -d+ -f1)
          BUILD=$(echo "$CURRENT" | cut -d+ -f2)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          if [ "$PATCH" -ge 9 ]; then
            PATCH=0
            MINOR=$((MINOR + 1))
          else
            PATCH=$((PATCH + 1))
          fi
          if [ "$MINOR" -ge 10 ]; then
            MINOR=0
            MAJOR=$((MAJOR + 1))
          fi
          BUILD=$((BUILD + 1))
          NEW="${MAJOR}.${MINOR}.${PATCH}+${BUILD}"
          sed -i "s/^version: .*/version: $NEW/" "$PUB"
          echo "NEW_VERSION=${MAJOR}.${MINOR}.${PATCH}+${BUILD}" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "Version bumped: $CURRENT -> $NEW"

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        id: analyze
        run: |
          # 两个 --no-fatal 都不能少：flutter analyze 的 fatal-infos 默认是开的，
          # 只写 --no-fatal-warnings 时，几百条 info 级 lint 照样把退出码打成 1
          # （run 33453510436 就是这样红的：0 error / 7 warning / 593 info → exit 1）。
          # 门禁只卡 error 级，info 作为技术债单独跟踪。
          # tee 落盘 + pipefail：analyze 失败时保留完整输出，排障不必靠猜。
          set -o pipefail
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee analyze_output.log

      - name: Upload analyze log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log-${{ steps.bump.outputs.VERSION_NAME }}
          path: analyze_output.log
          retention-days: 14

      - name: Run tests with coverage
        run: |
          flutter test --coverage
          # 输出覆盖率概览（line coverage），不阻断构建
          if [ -f coverage/lcov.info ]; then
            echo "Coverage report generated: coverage/lcov.info"
            awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{ if(lf>0) printf "Line coverage: %.1f%%\n", lh/lf*100; else print "No coverage data" }' coverage/lcov.info || true
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ steps.bump.outputs.VERSION_NAME }}
          path: coverage/lcov.info
          retention-days: 14

      - name: Build APK
        id: build
        run: |
          flutter build apk --release 2>&1 | tee build_output.log
          APK_PATH=$(find . -name "app-release.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "Flutter build didn't produce APK, trying Gradle directly..."
            cd android && ./gradlew assembleRelease 2>&1 | tee -a ../build_output.log
            cd ..
            APK_PATH=$(find . -name "app-release.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -n "$APK_PATH" ]; then
            echo "BUILD_EXIT_CODE=0" > build_result.txt
            echo "APK_PATH=$APK_PATH" >> build_result.txt
          else
            echo "BUILD_EXIT_CODE=1" > build_result.txt
          fi
        timeout-minutes: 20

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ steps.bump.outputs.VERSION_NAME }}
          path: |
            build_output.log
            build_result.txt
          retention-days: 30

      - name: Check build result and locate APK
        id: apk
        run: |
          EXIT_CODE=$(grep BUILD_EXIT_CODE build_result.txt | cut -d= -f2)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Build failed with exit code: $EXIT_CODE"
            tail -100 build_output.log
            exit 1
          fi
          APK_PATH=$(grep APK_PATH build_result.txt | cut -d= -f2)
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          APK_PATH="${{ steps.apk.outputs.APK_PATH }}"
          APK_DIR=$(dirname "$APK_PATH")
          cp "$APK_PATH" "$APK_DIR/HogwartLige-${{ steps.bump.outputs.VERSION_NAME }}.apk"
          echo "RENAMED_APK=$APK_DIR/HogwartLige-${{ steps.bump.outputs.VERSION_NAME }}.apk" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HogwartLige-${{ steps.bump.outputs.VERSION_NAME }}
          path: ${{ env.RENAMED_APK }}
          retention-days: 30

      - name: Upload APK (nightly)
        uses: actions/upload-artifact@v4
        with:
          name: HogwartLige-nightly
          path: ${{ env.RENAMED_APK }}
          retention-days: 7

      # ================================================================
      # P1-5：版本 bump + CHANGELOG sync + push 移到全部验证之后。
      # 旧顺序是先发版后验证：analyze/test/build 任一失败时版本号已经
      # bump 并推到 main（版本膨胀根因）。现在只有全部成功才发版。
      # ================================================================

      - name: Sync changelog to CHANGELOG.md（验证通过后）
        id: sync
        if: success()
        run: |
          chmod +x scripts/sync_changelog.sh
          bash scripts/sync_changelog.sh
          git add CHANGELOG.md pubspec.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "SYNCED=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: sync changelog for v${{ steps.bump.outputs.VERSION_NAME }} [skip ci]"
            git fetch origin main
            # 构建流程（pub get / analyze / test）可能在 checkout 之后又改过
            # 已跟踪文件（实测出现过 pubspec.lock / analysis_options.yaml 这类
            # 意外改动），不清理掉 rebase 会报 "cannot rebase: You have
            # unstaged changes"（run 33497533573 的 step18 即栽在这里）。
            # 这些改动都是构建副产物，无保留价值：checkout -- . 还原已跟踪文件，
            # clean -fd 删未跟踪产物（build/coverage 等已被 .gitignore 排除，
            # 不会被误删）。先打印状态留证据，下次再失败可直接对照。
            echo "--- dirty before cleanup ---"
            git status --porcelain
            git checkout -- .
            git clean -fd
            git rebase origin/main
            git push origin main
            echo "✅ Changelog synced and pushed"
            echo "SYNCED=true" >> "$GITHUB_OUTPUT"
          fi

      # ================================================================
      # 自动发布 Release + 清理老版本
      #
      # 此前 APK 只进 workflow artifacts（30 天过期）和 nightly.link（7 天），
      # 「发行版」页面是空的，README 写的"历史版本见 GitHub Releases"
      # 其实不存在——Release 全靠手动建。
      #
      # 现在：每次构建成功 → 以递增的版本号建 tag + Release（附 APK 与
      # 本版本 changelog 段），然后按创建时间保留最新 5 个 Release，
      # 更老的连同 tag 一起删除——版本号每次构建都递增，不留老 Release
      # 列表会无限膨胀，保留窗口内的历史足够回退。
      # ================================================================

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.bump.outputs.VERSION_NAME }}"
          TAG="v$VERSION"

          # 从 CHANGELOG.md 提取本版本段落作为 Release Notes
          # （sync_changelog.sh 已保证"### vX.Y.Z — date"段落存在）
          awk "/^### v${VERSION} /{flag=1; next} /^### v/{if(flag) exit} flag" \
            CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "HogwartLige v${VERSION} 自动构建" > release_notes.md
          fi

          # 重复跑同一版本时 tag 可能已存在（例如 workflow 重跑）：
          # 先删旧 Release 再重建，保证 Release 里的 APK 永远是本次构建产物
          gh release delete "$TAG" --yes 2>/dev/null || true

          gh release create "$TAG" "${{ env.RENAMED_APK }}" \
            --title "HogwartLige v${VERSION}" \
            --notes-file release_notes.md \
            --latest

          echo "✅ Released $TAG"

      - name: Prune old releases (keep latest 5)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=5
          # 按创建时间倒序跳过前 KEEP 个，其余连 Release 带 tag 一起删。
          # 删除失败不阻断构建——老版本清不掉是卫生问题，不是构建失败。
          OLD_TAGS=$(gh release list --json tagName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[$KEEP:] | .[].tagName")
          for tag in $OLD_TAGS; do
            echo "🧹 删除老版本 $tag"
            gh release delete "$tag" --yes || true
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" || true
          done
          REMAINING=$(gh release list --json tagName --jq 'length')
          echo "✅ Release 清理完成，当前共 $REMAINING 个"

      - name: Output download links
        run: |
          echo "## 📱 下载地址" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**GitHub Release 最新版（推荐，永久有效）**" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/zhaolongwudi/hogwarts_life_simulator/releases/latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**nightly.link（免登录直接下载最新构建）**" >> $GITHUB_STEP_SUMMARY
          echo "https://nightly.link/zhaolongwudi/hogwarts_life_simulator/workflows/android-build/main/HogwartLige-nightly.zip" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**GitHub Releases（保留最近 5 个版本）**" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/zhaolongwudi/hogwarts_life_simulator/releases" >> $GITHUB_STEP_SUMMARY