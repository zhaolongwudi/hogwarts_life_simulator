name: Auto Unzip & Deploy

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'ZIP文件下载地址'
        required: true
      branch:
        description: '目标分支'
        default: 'main'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Download ZIP
        run: |
          curl -L -o temp.zip "${{ inputs.zip_url }}"

      - name: Unzip
        run: |
          rm -rf temp_extracted
          mkdir temp_extracted
          unzip -o temp.zip -d temp_extracted

      - name: Find Root Directory
        run: |
          if [ $(ls temp_extracted | wc -l) -eq 1 ] && [ -d "temp_extracted/$(ls temp_extracted)" ]; then
            echo "检测到根目录，提取内部文件..."
            mv temp_extracted/$(ls temp_extracted)/* temp_extracted/
            rm -rf temp_extracted/$(ls temp_extracted)
          fi

      - name: Deploy Files
        run: |
          cp -r temp_extracted/. .

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Auto deploy: ${{ inputs.zip_url }}"
          git push
